name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.configuration }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install build and FFmpeg dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build g++ pkg-config ffmpeg \
            libavformat-dev libavcodec-dev libavfilter-dev libavutil-dev libswresample-dev
      - name: Configure
        run: cmake --preset linux-${{ matrix.configuration }}
      - name: Build
        run: cmake --build --preset linux-${{ matrix.configuration }} --parallel
      - name: Test
        run: ctest --preset linux-${{ matrix.configuration }}
      - name: Install
        run: cmake --install out/build/linux-${{ matrix.configuration }}
      - name: Launch installed executable
        run: |
          cd out/install/linux-${{ matrix.configuration }}/bin
          ./FlacConvert --help

  windows:
    name: Windows ${{ matrix.configuration }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Download pinned FFmpeg SDK
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-sdk.zip"
          $destination = Join-Path $env:RUNNER_TEMP "ffmpeg-sdk"
          Invoke-WebRequest `
            -Uri "https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/autobuild-2026-10-31-12-59/ffmpeg-N-128227-g4811625b5f-win64-gpl-shared.zip" `
            -OutFile $archive
          $expectedHash = "3b1a38912999da560d048ccd91590c7e04dc73b75e478300c1053dce8b0689a6"
          $actualHash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "FFmpeg SDK SHA-256 mismatch: $actualHash"
          }
          Expand-Archive -Path $archive -DestinationPath $destination
          $root = Get-ChildItem $destination -Directory | Select-Object -First 1 -ExpandProperty FullName
          "FFmpeg_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure
        run: cmake --preset windows-${{ matrix.configuration }}
      - name: Build
        run: cmake --build --preset windows-${{ matrix.configuration }} --parallel
      - name: Test
        run: ctest --preset windows-${{ matrix.configuration }}
      - name: Install
        run: cmake --install out/build/windows-${{ matrix.configuration }}
      - name: Launch installed executable
        shell: pwsh
        run: |
          Push-Location "out/install/windows-${{ matrix.configuration }}/bin"
          .\FlacConvert.exe --help
          Pop-Location
